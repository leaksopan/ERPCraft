[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
erpcraft-meta = { path = "crates/meta" }
# Without PostgreSQL / HTTP by default, so the UI also builds for the web; native apps turn them on.
erpcraft-engine = { path = "crates/engine", default-features = false }
erpcraft-mcp = { path = "crates/mcp" }
erpcraft-ui-egui = { path = "crates/ui-egui" }

# Shared Craft suite libraries, pinned to one revision on storytold/craft-libs `main`.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-csv = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-platform = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-web-api = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-web-host = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }
craft-xlsx = { git = "https://github.com/storytold/craft-libs", rev = "eeb5b26198865182463ceba31c8b64394793d22b", version = "=0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
wildcard_imports = "deny"
dbg_macro = "warn"
# ERPCraft never crashes: shipped code returns Result/Option instead of panicking (AGENTS.md).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
