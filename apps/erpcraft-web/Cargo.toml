[package]
name = "erpcraft-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ERPCraft in the browser: the egui app compiled to WebAssembly, on an in-memory demo company"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
erpcraft-engine = { workspace = true }
erpcraft-ui-egui = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
craft-platform = { workspace = true, features = ["browser"] }
craft-web-api = { workspace = true }
craft-web-host = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# Local::now() through the browser's Date (chrono's wasm support).
chrono = { workspace = true, features = ["wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
