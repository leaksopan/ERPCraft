[package]
name = "erpcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ERPCraft engine: the base application (tables, pages, triggers, posting) behind one command registry"

[lints]
workspace = true

[dependencies]
erpcraft-meta = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
# Synchronous PostgreSQL client (MIT OR Apache-2.0); no async runtime in the engine.
postgres = { version = "0.19", optional = true }
# Synchronous HTTP client (MIT OR Apache-2.0) for the Business Central API connector.
ureq = { version = "3", optional = true, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }

[features]
# Native builds keep everything; the web (wasm) build turns these off: no sockets there.
default = ["postgres", "bc"]
postgres = ["dep:postgres"]
bc = ["dep:ureq"]

[dev-dependencies]
postgres = "0.19"
